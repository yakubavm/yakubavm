e)" stroke="#344057" stroke-width="1"/><rect x="931" y="18" width="213" height="3" rx="2" fill="#50e3a4"/><text x="948" y="52" font-size="19" class="code" fill="#67e8f9" >05</text><text x="948" y="88" font-size="22" class="h" >DEVOPS</text><text x="948" y="124" font-size="18" class="t" >Build &amp; delivery</text><text x="948" y="154" font-size="16" class="m" >CI/CD and containers</text>
